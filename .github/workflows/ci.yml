name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@v0.6.1
      - run: make lint test
      - run: make test-structure
      - run: make test-sync
      - run: make build e2e
  release-snapshot:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
      - name: Verify release archives
        run: |
          set -euo pipefail
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            ls dist/trace_*_${target}.tar.gz >/dev/null
          done
          test -s dist/checksums.txt
      - run: ./scripts/install_snapshot_test.sh
  performance:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            hook_advisory: "0"
          # Hosted macOS VM process p95 has varied from 19.90 to 28.67 ms.
          # Keep the strict local and Linux gate; report VM timing in CI.
          - os: macos-latest
            hook_advisory: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make perf
        env:
          TRACE_PERF_HOOK_ADVISORY: ${{ matrix.hook_advisory }}
