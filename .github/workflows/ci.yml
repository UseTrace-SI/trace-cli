name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: cli-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: GOTOOLCHAIN=local go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
      - run: make lint test
      - name: Coordinated publication validation
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Repeat companion integration regressions 100 times
        run: go test -race -p 1 -count=100 -run TestCompanion -timeout=15m ./internal/companions ./internal/manifest ./internal/mcp ./internal/cli
      - run: make test-structure
      - run: make test-sync
      - run: make build e2e
  release-snapshot:
    env:
      GORELEASER_VERSION: v2.20.0
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Install pinned GoReleaser binary
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        continue-on-error: true
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          install-only: true
      - name: Build pinned GoReleaser if release downloads are unavailable
        if: steps.goreleaser.outcome == 'failure'
        run: go install -p 2 github.com/goreleaser/goreleaser/v2@"$GORELEASER_VERSION"
      - name: Build release snapshot
        run: goreleaser release --snapshot --clean --skip=sign
      - name: Verify release archives
        run: |
          set -euo pipefail
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            ls dist/trace_*_${target}.tar.gz >/dev/null
          done
          test -s dist/checksums.txt
      - run: ./scripts/install_snapshot_test.sh
      - name: Fresh coordinated Homebrew installation
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          set -euo pipefail
          brew tap usetrace-si/trace "$GITHUB_WORKSPACE"
          brew install usetrace-si/trace/trace
          brew test usetrace-si/trace/trace
  performance:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            hook_advisory: "0"
          # Hosted macOS VM process p95 has varied from 19.90 to 28.67 ms.
          # Keep the strict local and Linux gate; report VM timing in CI.
          - os: macos-latest
            hook_advisory: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: make perf
        env:
          TRACE_PERF_HOOK_ADVISORY: ${{ matrix.hook_advisory }}
