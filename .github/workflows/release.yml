name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: sigstore/cosign-installer@v3
      - name: Stage the qualified coordinated release
        run: |
          set -euo pipefail
          python3 scripts/prepare_coordinated_release.py --version "$GITHUB_REF_NAME" --out dist/coordinated
          source=$(cat dist/coordinated/source-cli.txt)
          git merge-base --is-ancestor "$source" HEAD
          git diff --exit-code "$source" HEAD -- cmd internal go.mod go.sum
          go run ./scripts/homebrew --version "${GITHUB_REF_NAME#v}" --checksums dist/coordinated/checksums.txt --out dist/coordinated/trace.rb
          cmp Formula/trace.rb dist/coordinated/trace.rb
      - name: Sign checksums
        run: cosign sign-blob --bundle=dist/coordinated/checksums.sigstore.json dist/coordinated/checksums.txt --yes
      - name: Publish the exact hosted archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf 'Coordinated CLI, Brain and Graph release. Archives are byte-identical to the qualified hosted release. Exact source revisions are recorded in stack.json.\n' > dist/coordinated/notes.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest --title "Trace $GITHUB_REF_NAME" --notes-file dist/coordinated/notes.txt dist/coordinated/*.tar.gz dist/coordinated/checksums.txt dist/coordinated/checksums.sigstore.json dist/coordinated/stack.json dist/coordinated/trace.rb
